[project]
name = "needle-mcp"
version = "0.1.0"
description = "Production-ready MCP server for local structured extraction, classification, and summarization using Cactus Needle."
authors = [{name = "yugaaank", email = "yugaaank@users.noreply.github.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cactus-needle>=2.0.8",
    "mcp>=2.0.0",
    "json-repair",
]

[project.urls]
Homepage = "https://github.com/yugaaank/needle-mcp"
Repository = "https://github.com/yugaaank/needle-mcp"

[project.scripts]
needle-mcp = "needle_mcp.mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
